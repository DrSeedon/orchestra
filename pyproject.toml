[project]
name = "orchestra"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.1.72",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "jinja2>=3.1,<4.0",
    "mcp>=0.1,<2.0",
    "httpx>=0.27,<1.0",
    "telegramify-markdown>=1.1.3",
    "markdown>=3.10.2",
    "aiogram>=3.28,<4.0",
    "aiohttp>=3.9,<4.0",
    "python-multipart>=0.0.20",
    "python-dotenv>=1.0,<2.0",
    "croniter>=2.0,<7.0",
    "pyyaml>=6.0,<7.0",
    "pillow>=10.0,<13.0",
]

[project.optional-dependencies]
# RAG semantic memory — heavy ML deps (onnxruntime ~pulled by fastembed). Install with
# `uv sync --extra rag`. Orchestra runs without them when RAG_ENABLED is unset/false.
rag = [
    "fastembed>=0.8.0",
    "sqlite-vec>=0.1.6",
    "watchfiles>=0.24",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.24,<2.0",
    "pytest-timeout>=2.3,<3.0",
    "pytest-playwright>=0.6,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["worktrees", ".venv", "data", "docs"]
