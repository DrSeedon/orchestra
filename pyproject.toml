[project]
name = "orchestra"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.111",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "jinja2>=3.1,<4.0",
    "mcp>=0.1,<2.0",
    "httpx>=0.27,<1.0",
    "telegramify-markdown>=1.1.3",
    "markdown>=3.10.2",
    "aiogram>=3.28,<4.0",
    "aiohttp>=3.9,<4.0",
    "python-multipart>=0.0.20",
    "python-dotenv>=1.0,<2.0",
    "croniter>=2.0,<7.0",
    "pyyaml>=6.0,<7.0",
    "pillow>=10.0,<13.0",
]

[project.optional-dependencies]
# RAG semantic memory — heavy ML deps (onnxruntime ~pulled by fastembed). Install with
# `uv sync --extra rag`. Orchestra runs without them when RAG_ENABLED is unset/false.
rag = [
    "fastembed>=0.8.0",
    "sqlite-vec>=0.1.6",
    "watchfiles>=0.24",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.24,<2.0",
    "pytest-timeout>=2.3,<3.0",
    "pytest-playwright>=0.6,<1.0",
]

[tool.uv]
# Барьер ФИКСИРОВАННЫЙ, не скользящий. Глобальный `~/.config/uv/uv.toml` на машине юзера
# содержит `exclude-newer = "7 days"` — это окно уползает вперёд и раз в неделю само впускает
# свежие версии в прод. Проектная настройка перекрывает глобальную; дата двигается только руками
# и только вместе с прогоном тестов.
#
# ВАЖНО: сам по себе барьер НЕ пин — пакеты, опубликованные ДО этой даты, всё равно
# подтягиваются новее (замер: uvicorn 0.48 → 0.51 при выставленном exclude-newer).
# Настоящий пин — `uv.lock`. Барьер лишь делает резолв детерминированным.
#
# Дата совпадает с содержимым лока: самый свежий пакет в `uv.lock` загружен 2026-07-08.
# Ставить дату НОВЕЕ лока нельзя — следующий `uv lock` тогда разом обновит ~40 пакетов
# (проверено: uvicorn 0.48 → 0.52.1, aiogram 3.28.2 → 3.30.0). Двигать эту дату — значит
# осознанно обновлять зависимости: меняешь дату, гоняешь `uv lock`, гоняешь тесты, коммитишь
# лок и дату ОДНИМ коммитом.
exclude-newer = "2026-07-09T10:16:55.018333899Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["worktrees", ".venv", "data", "docs"]
markers = [
    "needs_two_users: требует беспарольного sudo — владение файлами не моделируется заглушками",
]
