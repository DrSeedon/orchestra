name: default
description: Upstream-derived v2.18 pipeline with local models and runtime modules.
validation: fail-open
defaults:
  model: hubsol
  skills: [html-artifacts, video-artifact, explainer-craft]
  mcp_servers: []
  inherit_claude_md: true
  prompt_layers:
    orchestrator: [base.md, "roles/{role}.md"]
    worker:       [base.md, "roles/{role}.md"]
  worktree:
    symlinks: []
    copies:   [CLAUDE.md, .mcp.json, .env, .worktreeinclude]
    # Partial (sparse) worker copies. `exclude` stays out of the copy; `own` are the task's own
    # directories ({id} = task number, e.g. V-821), present from the first turn; `include` always
    # stays; `reference_scan` lists source directories whose mentions of an excluded directory
    # (KB links, test fixtures) pull that directory into the copy. A project overrides by a glob
    # on its repository root; `enabled: false` there (or here) gives a full copy again.
    sparse:
      enabled: true
      exclude: [artifacts, .orchestra/tasks]
      own:
        - ".orchestra/tasks/{id}"
        - "artifacts/{id}"
        - "artifacts/task-{id}"
        - "artifacts/{id}-*"
        - "artifacts/task-{id}-*"
      projects:
        "*/katya-work":
          include: [artifacts/task-2/tooling]
        "*/orchestra":
          reference_scan: [.orchestra/kb, tests, scripts]
  base_branch_strategy: main
  docs_scaffold: false
# `&effort_policy` — единственное YAML-определение карты модель→ступень; остальные роли ссылаются
# на него через `*effort_policy`. Это остаётся обычным role.effort и работает без рестарта сервера.
# Ключом обязана быть МОДЕЛЬ, а не рантайм: Sol и Luna оба `codex` и требуют разных ступеней.
# Разрешение (`pipeline.resolve_effort`): точный id модели → рантайм → `default` → нет эффорта.
# Скаляр остаётся валидным — просто здесь он больше не используется.
# Оркестраторы подняты с `medium` до `high` по прямому указанию юзера (#214): #208 меряло только
# рабочие роли, но medium→high — САМЫЙ крупный шаг лестницы Opus (+2.9 пункта), и переносить его
# на оркестраторов дешевле, чем оставлять их на ступени, выбранной до этого замера. Откат — правка
# одного ключа модели Opus в двух ролях ниже; живые агенты подхватят её на следующем ходе.
# Opus 5.5 у оркестраторов: medium с 23.09, снова high с 03.10 по слову владельца как замер
# (V-683: жалобы katya-work выросли 8% → 13% после 23.09; модель и effort сменились разом).
# Сравнение — .orchestra/tasks/V-683/complaint_rate.py через 4–5 дней. Воркеры остаются medium.
# Основания значений:
#   harness           → medium — бесплатные маршруты OpenRouter, ступень НЕ измерена ни на одном
#                               из них; medium выбран как середина и как выключатель гейта
#                               планирования (todo_write включается только на high).
#   claude-opus-5-5[1m] / hub-claude-opus-5-5 → xhigh — решение владельца 09.11.2026 для оркестраторов
#                               и воркеров: AA FrontierCode 2.0 44% на xhigh против 36% на high,
#                               Terminal-Bench 4.0 60%. Прежнее основание high (#208: high→xhigh
#                               +1.0 пункта при +47% цены) этим решением заменено; max не брать.
#   claude-sonnet-5-5[1m] / hub-claude-sonnet-5-5 → high — 09.11.2026: на medium код в 2.4 раза хуже
#                               (FrontierCode 2.0 26% против 11%).
#   hub-gemini-4-argon → medium — дефолт Argon, 09.11.2026.
#   gpt-6-astra       → medium — собственное колено Astra: coding ≈65/$2.19; high добавляет около
#                               0.5 пункта за +32%.
#   gpt-6-luna        → high  — действующее семейство Luna
#   gpt-6.1-terra     → high  — explicit orchestrator choice, owner decision 2026-10-31
#   default           → high  — модели без отдельного замера
roles:
  orchestrator:
    kind: orchestrator
    label: Orchestrator
    order: 0
    model: gpt-6.1-terra
    # Ручной выбор Astra владельцем оставляет ступень для оркестраторского промпта;
    # агентские вызовы блокируются централизованным model gate.
    effort: &effort_policy {gpt-6.1-terra: high, "claude-opus-5-5[1m]": xhigh, "claude-sonnet-5-5[1m]": high, claude-haiku-5-5: low, hub-gpt-6.1-sol: xhigh, hub-gemini-4-carbon: medium, hub-gemini-4-hydrogen: high, hub-gemini-4-argon: medium, hub-gpt-6-astra: high, hub-gpt-6-luna: high, hub-claude-opus-5-5: xhigh, hub-claude-sonnet-5-5: high, hub-claude-haiku-5-5: low, gpt-6-luna: high, gpt-6-astra: medium, harness: medium, default: high}
    skills: [grill-me, orchestra-agents, laptop-access, edo-1c, vps-deploy]
    modules: [safety, project-maintenance, code-quality, dynamic-workflows, model-routing, git-workflow, orchestration, worker-lifecycle, background-jobs, task-management, knowledge, communication-style, user-values]
    can_spawn: [worker, full-cycle, reducer, specialist]
    allow_unrouted_workers: true
    tg: {emoji: "👑"}
    when: Managing a team of workers, decomposing tasks, approving plans
    not_for: Direct implementation — delegate to workers
    description: >
      Manages worker agents. Decomposes tasks, spawns workers, reviews results.
      Available worker roles are injected automatically from roles/ directory.
  sub-orchestrator:
    kind: orchestrator
    label: Sub-Orchestrator
    order: 1
    model: gpt-6.1-terra
    effort: *effort_policy
    skills: [orchestra-agents, laptop-access, edo-1c, vps-deploy]
    modules: [safety, project-maintenance, code-quality, dynamic-workflows, model-routing, git-workflow, orchestration, worker-lifecycle, background-jobs, task-management, knowledge, communication-style, user-values]
    # Роль sub-orchestrator ЗАМОРОЖЕНА решением владельца 18.09.2026: её нельзя
    # заспавнить ни одной роли.
    can_spawn: [worker, full-cycle, reducer, specialist]
    allow_unrouted_workers: true
    tg: {emoji: "🎯"}
    when: Managing a sub-team within a larger hierarchy (department lead, tech lead, team lead)
    not_for: Direct implementation — delegate to workers
    description: >
      Manages a subset of workers under a parent orchestrator.
      Reports up to parent, delegates down to workers.
  worker:
    kind: worker
    label: Worker
    order: 2
    model: hub-gpt-6.1-sol
    effort: &worker_effort_policy {"claude-opus-5-5[1m]": xhigh, "claude-sonnet-5-5[1m]": high, claude-haiku-5-5: low, hub-gpt-6.1-sol: xhigh, hub-gemini-4-carbon: medium, hub-gemini-4-hydrogen: high, hub-gemini-4-argon: medium, hub-gpt-6-astra: high, hub-gpt-6-luna: high, hub-claude-opus-5-5: xhigh, hub-claude-sonnet-5-5: high, hub-claude-haiku-5-5: low, gpt-6-luna: high, gpt-6-astra: medium, harness: medium, default: high}
    skills: [laptop-access, edo-1c]
    modules: [safety, project-maintenance, code-quality, git-workflow, report-format, knowledge, communication-style, user-values]
    can_spawn: []
    allow_unrouted_workers: false
    tg: {emoji: "⚙️"}
    when: Clear task for a known module, implementation from detailed spec, bug fix with known repro
    not_for: Tasks needing research or unknown scope — use full-cycle
    description: >
      General-purpose worker for one bounded task. Implements it directly, no pipeline
      gates, and cannot spawn other agents. For system workers (permanent, module-scoped)
      and disposable one-shots. (owner decision, 2026-10-16)
  full-cycle:
    kind: worker
    label: Full-Cycle
    order: 3
    model: hub-gpt-6.1-sol
    # Opus 5.5 снова xhigh по решению владельца 09.11.2026 (основания над `roles:`); #207
    # переводил его на high по чужим бенчмаркам короче наших сессий. У Sol и Astra ступени
    # свои (#214, #373).
    effort: *worker_effort_policy
    skills: [laptop-access, edo-1c]
    modules: [safety, project-maintenance, dynamic-workflows, model-routing, research-method, code-quality, git-workflow, worker-lifecycle, report-format, task-management, knowledge, communication-style, user-values]
    can_spawn: [worker, full-cycle, reducer, specialist]
    allow_unrouted_workers: false
    tg: {emoji: "🔄"}
    when: New feature with unknowns, large refactoring (5+ files), external integration, deep research (find out everything about X), empirical measurement / benchmarks, anything where wrong approach = wasted day
    not_for: Trivial bug fixes, config changes, one-line implementation from a clear spec
    description: >
      Drives a task through the full cycle (research, plan, implementation, verification)
      with the complete module set, and can spawn sub-workers for independent work. Owns an
      approved outcome end-to-end and chooses the depth of each stage. Research-only
      assignments end at findings. Explicit approval boundaries remain in force.
      (owner decision, 2026-10-16)
  reducer:
    kind: worker
    label: Reducer
    order: 4
    model: hub-gpt-6.1-sol
    effort: *effort_policy
    modules: [safety, knowledge, communication-style, user-values]
    can_spawn: []
    tg: {emoji: "🧾"}
    when: Collecting fan-out child reports into one lossless handoff for the parent
    not_for: Selecting, summarizing, deciding, implementing, or managing agents
    description: >
      Cheap fan-out report collector. Receives child reports, preserves every report,
      and sends one combined handoff to the parent without selecting or interpreting it.
  specialist:
    kind: worker
    label: Gemini Specialist
    order: 5
    model: hub-gemini-4-argon
    effort: {hub-gemini-4-hydrogen: high, default: medium}
    skills: []
    modules: [safety, project-maintenance, code-quality, model-routing, git-workflow, report-format, knowledge, communication-style, user-values]
    disabled_tools: [hub_generate_image]
    can_spawn: []
    allow_unrouted_workers: false
    tg: {emoji: "🎨"}
    when: Bounded design, document synthesis/comparison, and financial/legal reasoning on project and company material (owner decision 2026-11-04); video only after Hub input support is verified
    not_for: General terminal/repository coding, credentials or secrets, live infrastructure, unverified media inputs or paid auxiliary tools
    description: >
      Dedicated non-spawning specialist for one bound task and project. Uses the existing
      paid Hub pool on Gemini 4 Argon at medium effort.
