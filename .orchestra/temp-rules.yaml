# Temporary agent rules, managed by the temp_rule_* tools; hand edits and git pulls are honoured.
# An entry without a reason, or without a date in mode expires/review, is skipped with a warning.
rules:
- id: rule-e0a8095e6f
  project: '*'
  mode: permanent
  targets:
  - all
  author: Orchestra-orchestrator
  created_at: '2026-10-22T11:30:51.528596+00:00'
  text: 'Hub models have no practical limits for us. When our own subscription gate is closed, or by default,
    run workers on the MultiCode hub: `hubsol` (GPT-6.1 Sol), `hubsonnet` or `hubopus`, any of them. Sol
    6.1 is for any work, regardless of how much of its pool remains. Use Opus or Sonnet for important
    creative work, or when the user asks for that model; name that reason in `model_reason`. Model choice
    is owned by Orchestra''s model-routing and this rule: do not keep model-routing rules in personal
    memory or project rules files.'
  reason: 'Owner decision 2026-10-22 18:30 KRS: the hub pool is effectively unlimited; Sol for any work
    regardless of remaining quota, Opus and Sonnet for important creative work or on the user''s request;
    personal and project prompts must not carry their own model routing, the default lives in Orchestra.
    Permanent by the owner''s word.'
- id: rule-5ce7a458f0
  project: '*'
  mode: permanent
  targets:
  - orchestrators
  author: Orchestra-orchestrator
  created_at: '2026-10-22T11:43:45.293988+00:00'
  text: 'Every worker that runs on the MultiCode hub (model hubsol, hubsonnet, hubopus, hubhaiku) must
    be killed with kill_worker once its work is done: right after its result is merged with task_outcome="complete"
    (or its research result is saved), check worker_wip and kill it. The only exception is hub workers
    doing game design. This overrides the persistent-lifecycle default for hub workers. The kill gate
    still applies: never kill with uncommitted files or unmerged work that is not obsolete.'
  reason: 'Owner decision 2026-10-22 18:43 KRS: hub workers other than game-design ones are deleted after
    their work is done; set without an end date, like the hub model rule rule-e0a8095e6f.'
