  text: 'Default worker route is `hubsol` (GPT-6.1 Sol on the MultiCode hub) for every task: Sol handles
    technical work well (bug fixes, features, tests, refactors, research, reports). Choose Claude on the
    hub (`hubsonnet`; `hubopus` for known-heavy work) only with a named reason, stated in your spawn/change
