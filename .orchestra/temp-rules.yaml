# Temporary agent rules, managed by the temp_rule_* tools; hand edits and git pulls are honoured.
# An entry without a reason, or without a date in mode expires/review, is skipped with a warning.
rules:
- id: rule-9c4419609f
  project: '*'
  mode: permanent
  targets:
  - all
  author: Orchestra-orchestrator
  created_at: '2026-10-22T16:51:58.310067+00:00'
  text: 'Image generation goes to the MultiCode hub first: spawn a `hubsol` worker and have it draw with
    Codex''s built-in image generator (gpt-image-2). This applies to any picture or design work: icons,
    illustrations, mockups, UI/visual designs, video frames. It costs our money nothing and ranked above
    Nano Banana 2.1 on Arena text-to-image (1383 vs 1328, October 2026). For a set of related images,
    ask for one sheet per set in one request, then cut it up if needed. Paid generators (OpenRouter via
    the websearch MCP `generate_image`, any API key of ours) are only a fallback: use them when the hub
    is unavailable, for a live chat reply that cannot wait about 40 seconds, or when the task data must
    not leave our machines. Do not use the hub''s DostupAI credits until the owner clarifies whose they
    are.'
  reason: 'Owner decision 2026-10-22 23:51 KRS: katya-work showed that a hub Sol worker drew a 9-image
    sheet in 40 s with Codex''s built-in gpt-image-2 without our money; the owner ordered using it as
    much as possible instead of our paid generator, for any images and designs, as a permanent rule for
    everyone.'
- id: rule-bcbb1c8260
  project: '*'
  mode: permanent
  targets:
  - orchestrators
  author: Orchestra-orchestrator
  created_at: '2026-10-31T04:11:50.651392+00:00'
  text: 'Owner decision, 2026-10-31: Claude Code updates are paused until the owner explicitly resumes
    them. Do not install newer Claude Code versions or run update canaries for Claude on the VPS or laptop.
    Keep the currently installed Claude version. Continue the existing authorized Codex CLI update workflow:
    read release notes, isolated canary, then install and verify only if successful. This pause does not
    change model routing, subscriptions, credentials or service restart policy.'
  reason: The owner explicitly paused Claude updates after the subscription-refused update canary and
    reaffirmed continuing Codex updates. No expiry is assumed; the pause remains until his next explicit
    decision.
- id: rule-63a4418ddd
  project: '*'
  mode: permanent
  targets:
  - all
  author: Orchestra-orchestrator
  created_at: '2026-11-02T17:28:22.108842+00:00'
  text: 'Owner decision, 2026-11-03 00:27 KRS (2026-11-02 UTC): every Hub worker in every Orchestra project
    must use hubsol (GPT-6.1 Sol), including creative work, research and existing workers. Hub Opus is
    forbidden; Hub Sonnet/Haiku and all other Hub model routes are also forbidden. This supersedes prior
    creative-work permissions and ordinary Hub Claude routing. Do not start or resume a non-Sol Hub turn.
    Interrupt active non-Sol Hub workers reversibly and preserve sessions, worktrees, journals, archives
    and pending-delivery IDs; migrate only idle workers through the normal history-preserving change_worker_model
    route. A privacy hold, ambiguous provider outcome or unavailable Sol capacity is a blocker, never
    permission to clear guards, reset history, replay a turn, spawn an escape worker or fall back to Claude/native/API.
    Orchestrator models and the protected-local Luna exception are unchanged. Report concrete migration
    blockers to Orchestra-orchestrator; do not send acknowledgement-only replies.'
  reason: 'The owner urgently reported that our Claude usage is exhausting a shared company pool and explicitly
    ordered: ''вся оркестра хаб воруерв только на сол 6.1 ... Опус нельзя''. Apply immediately across
    all projects while usage attribution and permanent enforcement are prepared.'
