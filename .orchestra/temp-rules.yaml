# Temporary agent rules, managed by the temp_rule_* tools; hand edits and git pulls are honoured.
# An entry without a reason, or without a date in mode expires/review, is skipped with a warning.
rules:
- id: rule-e402924620
  project: '*'
  mode: permanent
  targets:
  - orchestrators
  author: Orchestra-orchestrator
  created_at: '2026-10-22T12:02:55.976285+00:00'
  text: 'Owner decision, 2026-10-29 19:26 KRS: immediately archive any MultiCode hub worker (hubsol, hubsonnet,
    hubopus or hubhaiku), regardless of lifecycle label or specialization, once its task is finished,
    its result is merged into the project''s main repository or its research is saved there, and it has
    no further explicitly assigned task. Do not retain an unassigned hub worker for warm context, possible
    future work, a project backlog, or an idle grace period. Inspect worker_wip and call kill_worker in
    the same completion handling. Preserve the kill gate: never delete uncommitted or unmerged work; pending
    acceptance, required validation or an explicitly unfinished phase is unfinished work, not a completed
    disposable worker. Finish acceptance/preservation promptly, then archive immediately. A currently
    running, waiting or explicitly assigned task remains active. This replaces the earlier game-design
    exception and automatic warm-context retention; native-worker lifecycle rules remain separate.'
  reason: 'Owner''s direct instruction, 2026-10-29 19:26 KRS: write the rule that a hub worker must be
    deleted IMMEDIATELY after finishing if it has no tasks. The decisive criterion is explicitly assigned
    work, not a specialization or warm context. Results and irreplaceable WIP must first be preserved.
    Updating existing all-project rule in place makes the instruction effective next turn while its canonical
    worker-lifecycle wording is prepared.'
- id: rule-9c4419609f
  project: '*'
  mode: permanent
  targets:
  - all
  author: Orchestra-orchestrator
  created_at: '2026-10-22T16:51:58.310067+00:00'
  text: 'Image generation goes to the MultiCode hub first: spawn a `hubsol` worker and have it draw with
    Codex''s built-in image generator (gpt-image-2). This applies to any picture or design work: icons,
    illustrations, mockups, UI/visual designs, video frames. It costs our money nothing and ranked above
    Nano Banana 2.1 on Arena text-to-image (1383 vs 1328, October 2026). For a set of related images,
    ask for one sheet per set in one request, then cut it up if needed. Paid generators (OpenRouter via
    the websearch MCP `generate_image`, any API key of ours) are only a fallback: use them when the hub
    is unavailable, for a live chat reply that cannot wait about 40 seconds, or when the task data must
    not leave our machines. Do not use the hub''s DostupAI credits until the owner clarifies whose they
    are.'
  reason: 'Owner decision 2026-10-22 23:51 KRS: katya-work showed that a hub Sol worker drew a 9-image
    sheet in 40 s with Codex''s built-in gpt-image-2 without our money; the owner ordered using it as
    much as possible instead of our paid generator, for any images and designs, as a permanent rule for
    everyone.'
