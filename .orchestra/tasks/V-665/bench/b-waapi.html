<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>B · Web Animations API</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23007aff'/%3E%3Cpath d='M6 4.5v7l6-3.5z' fill='%23fff'/%3E%3C/svg%3E">
<style>
body{margin:0;background:#f5f5f7;color:#1d1d1f;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
.mv{max-width:980px;margin:16px auto;background:#fff;border-radius:12px;padding:14px 16px}
.mv h1{font-size:21px;margin:0 0 8px}.mv svg{width:100%;height:auto;display:block}
.cap{min-height:3.4em;margin:8px 0}.cap b{display:block;font-size:16px}
.bar{display:flex;gap:6px;align-items:center}.bar input{flex:1}
.bar button,.bar select{border:1px solid #d2d2d7;background:#fff;border-radius:8px;padding:4px 10px;font:inherit;cursor:pointer}
#clock{font-variant-numeric:tabular-nums;min-width:92px;text-align:right;color:#6e6e73}
.ch{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0;padding:0;list-style:none}
.ch li{padding:3px 9px;border-radius:8px;background:#f5f5f7;cursor:pointer}.ch li.on{background:#007aff;color:#fff}
@media print{.bar{display:none}}
</style></head><body>
<div class="mv">
<h1>Путь задачи (бенч: одинаковая сцена для всех техник)</h1>
<svg id="stage" viewBox="0 0 900 220" role="img" aria-labelledby="st"><title id="st">Задача идёт от владельца к воркеру</title>
 <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#86868b"/></marker></defs>
 <path id="e1" d="M190 110H350" stroke="#86868b" stroke-width="2" marker-end="url(#ar)" fill="none"/>
 <path id="e2" d="M550 110H710" stroke="#86868b" stroke-width="2" marker-end="url(#ar)" fill="none"/>
 <rect id="n1" x="40" y="75" width="150" height="70" rx="12" fill="#ffffff" stroke="#007aff" stroke-width="2"/>
 <rect id="n2" x="350" y="75" width="200" height="70" rx="12" fill="#ffffff" stroke="#d2d2d7" stroke-width="2"/>
 <rect id="n3" x="710" y="75" width="150" height="70" rx="12" fill="#ffffff" stroke="#d2d2d7" stroke-width="2"/>
 <text x="115" y="115" text-anchor="middle">Владелец</text><text x="450" y="115" text-anchor="middle">Оркестратор</text><text x="785" y="115" text-anchor="middle">Воркер</text>
 <circle id="dot" r="9" fill="#007aff" opacity="0"/>
 <text id="st3" x="785" y="170" text-anchor="middle" fill="#6e6e73">ожидает</text>
</svg>
<div class="cap" aria-live="polite"><b id="capT"></b><span id="capX"></span></div>
<div class="bar"><button id="bPrev" aria-label="Предыдущий шаг">⏮</button><button id="bPlay" aria-label="Пуск или пауза">▶</button><button id="bNext" aria-label="Следующий шаг">⏭</button>
 <input id="seek" type="range" min="0" step="0.01" value="0" aria-label="Время"><span id="clock"></span>
 <select id="rate" aria-label="Скорость"><option>0.5</option><option selected>1</option><option>2</option></select></div>
<ol class="ch" id="chap"></ol>
</div>
<script>
// ── СЦЕНА ──
const STEPS=[{d:2,t:'Владелец ставит задачу',x:'Задача появляется у владельца.'},{d:2,t:'Задача уходит оркестратору',x:'Оркестратор получает постановку.'},
 {d:2,t:'Оркестратор назначает воркера',x:'Воркер берёт задачу в работу.'},{d:2,t:'Воркер сделал',x:'Результат готов к мержу.'}];
const $=id=>document.getElementById(id),A=[],an=(id,kf,s,d)=>A.push($(id).animate(kf,{delay:s*1000,duration:d*1000,fill:'forwards',easing:'ease-in-out'}));
$('dot').setAttribute('opacity',1);$('dot').style.opacity=0;$('dot').style.transform='translate(190px,110px)';
an('dot',[{opacity:0},{opacity:1}],0,2);
an('dot',[{transform:'translate(190px,110px)'},{transform:'translate(350px,110px)'}],2,2);
an('n2',[{stroke:'#d2d2d7'},{stroke:'#007aff'}],2,2);
an('dot',[{transform:'translate(550px,110px)'},{transform:'translate(710px,110px)'}],4,2);
an('n3',[{stroke:'#d2d2d7'},{stroke:'#007aff'}],4,2);
an('dot',[{opacity:1},{opacity:0}],6,2);
an('n3',[{fill:'#ffffff',stroke:'#007aff'},{fill:'#e8f7ec',stroke:'#34c759'}],6,2);
const sync=t=>{$('st3').textContent=t>6?'готово':'ожидает';$('st3').setAttribute('fill',t>6?'#248a3d':'#6e6e73')}; // текст WAAPI не анимирует
// ── ПЛЕЕР ──
const P=(()=>{const S=[];let T=0,ci=-1,on=false;for(const s of STEPS){S.push(T);T+=s.d}
 const M=document.body.animate([{},{}],{duration:T*1000,fill:'forwards'}); // главные часы
 const all=()=>[M,...A],now=()=>Math.min(T,M.currentTime/1000);
 const at=t=>{let i=S.length-1;while(i>0&&t<=S[i])i--;return i},end=i=>S[i]+STEPS[i].d;
 function ui(){const t=now(),i=at(t);sync(t);$('seek').value=t;$('clock').textContent=t.toFixed(1)+' / '+T.toFixed(1)+' с';
  if(i!==ci){ci=i;$('capT').textContent=(i+1)+'. '+STEPS[i].t;$('capX').textContent=STEPS[i].x;[...$('chap').children].forEach((li,k)=>li.classList.toggle('on',k==i))}}
 function loop(){ui();if(on){if(now()>=T)pause();else requestAnimationFrame(loop)}}
 function seek(v){all().forEach(a=>{a.pause();a.currentTime=Math.min(T,Math.max(0,v))*1000});on=false;$('bPlay').textContent='▶';ui()}
 function play(){if(now()>=T)seek(0);all().forEach(a=>{a.playbackRate=+$('rate').value;a.play()});on=true;$('bPlay').textContent='⏸';loop()}
 function pause(){all().forEach(a=>a.pause());on=false;$('bPlay').textContent='▶';ui()}
 const toggle=()=>on?pause():play(),next=()=>{const t=now(),i=at(t);seek(t<end(i)-1e-3?end(i):end(Math.min(i+1,S.length-1)))},prev=()=>{const i=at(now());seek(i?end(i-1):0)};
 $('seek').max=T;$('seek').oninput=e=>seek(+e.target.value);$('bPlay').onclick=toggle;$('bNext').onclick=next;$('bPrev').onclick=prev;
 $('rate').onchange=()=>all().forEach(a=>a.updatePlaybackRate(+$('rate').value));
 STEPS.forEach((s,k)=>{const li=document.createElement('li');li.textContent=(k+1)+'. '+s.t;li.onclick=()=>{seek(S[k]);play()};$('chap').append(li)});
 addEventListener('keydown',e=>{const f={' ':toggle,ArrowRight:next,ArrowLeft:prev,Home:()=>seek(0),End:()=>seek(T)}[e.key];if(f&&e.target.tagName!='SELECT'){e.preventDefault();f()}});
 seek(+(location.hash.match(/t=([\d.]+)/)||[])[1]||0);return{seek,play,pause,get t(){return now()},T,S}})();
</script></body></html>
