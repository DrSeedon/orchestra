<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Frame events and sound cues</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#0b0e14;color:#eef1f7;font:22px/1.4 Manrope,Arial,sans-serif}
body{display:flex;align-items:center;justify-content:center}.scene{width:1280px;height:720px;padding:54px 64px;position:relative}
h1{font-size:36px;margin:0 0 14px}.sub{color:#8b93a7;font:20px "JetBrains Mono",monospace}
svg{width:100%;height:430px;margin-top:24px}.track{stroke:#2a3142;stroke-width:8;stroke-linecap:round}.tick{stroke:#394154;stroke-width:2}
.label{font-size:22px;fill:#8b93a7;font-family:"JetBrains Mono",monospace}.accent{fill:#58c4dd}.gold{fill:#f0ac5f}.green{fill:#83c167}
#caption{position:absolute;left:64px;right:64px;bottom:44px;min-height:92px;border-top:1px solid #2a3142;padding-top:18px;color:#c4cad6;font-size:23px}
#step{color:#58c4dd;font:16px "JetBrains Mono",monospace;margin-right:14px}
</style>
</head>
<body><main class="scene">
<h1>A sound cue follows the frame</h1>
<div class="sub">the timeline supplies time · motion supplies the event</div>
<svg id="stage" viewBox="0 0 1152 430" role="img" aria-label="A marker moves along a timeline and comes to rest at the event line">
 <line class="track" x1="124" y1="220" x2="1028" y2="220"/>
 <g id="ticks"></g>
 <line id="event" x1="710" y1="120" x2="710" y2="320" stroke="#fc6255" stroke-width="4" opacity="0"/>
 <circle id="marker" cx="160" cy="220" r="44" fill="#58c4dd"/>
 <text id="event-label" x="710" y="95" text-anchor="middle" class="label">LAND</text>
 <text x="124" y="284" class="label">start</text><text x="1028" y="284" text-anchor="end" class="label">next state</text>
 <text id="readout" x="576" y="370" text-anchor="middle" class="label">frame time → cue time</text>
</svg>
<div id="caption"><span id="step"></span><span id="say"></span></div>
</main>
<script>
const STEPS = [
 {d:4,t:"Motion begins",say:"The marker moves across the timeline at a steady speed.",events:[{id:"marker-motion",at:1.43,sound:"whoosh/fs-147285-fh-paper-swipe-surface2-shor-1",weight:"support",visual:"move"}]},
 {d:4,t:"Motion stops",say:"Near the boundary, the marker speeds up, stops, and a thump lands.",hold:2,events:[{id:"marker-land",at:3.5,sound:"thump/fs-389999-thump-cloth-1",weight:"support",visual:"land"}]},
 {d:4,t:"The frame anchors the sound",say:"The cue time comes from the same step timing as the picture.",events:[]},
 {d:4,t:"Measured mix",say:"Voice, effects, and a quiet music bed share one measured mix.",hold:1.2,events:[]},
];
STEPS.forEach(s=>s.x??=s.sub??s.say);window.voice?.(STEPS);
const $=id=>document.getElementById(id);let now=0;
function seek(t){now=Math.max(0,Math.min(P.T,t));const d=STEPS.map(s=>s.d),b=[0];d.forEach((v,i)=>b.push(b[i]+v));let i=d.findIndex((v,k)=>now<b[k+1]);if(i<0)i=d.length-1;let p=(now-b[i])/d[i];
 let x=160;if(i===0)x=160+340*p;else if(i===1)x=500+210*Math.min(1,Math.max(0,(now-b[1]-3.1)/.4));else x=710;
 $('marker').setAttribute('cx',x);$('event').setAttribute('opacity',i>=1?1:0);$('event-label').setAttribute('opacity',i>=1?1:0);
 $('readout').textContent=i===0?`moving · ${Math.round(100*p)}%`:i===1&&now-b[1]<3.5?"approaching the event line":"event frame · marker at rest";
 $('step').textContent=`${i+1} / ${STEPS.length} · ${STEPS[i].t}`;$('say').textContent=STEPS[i].x}
const P={get t(){return now},get T(){return STEPS.reduce((n,s)=>n+s.d,0)},seek};P.seek(0);
</script>
</body>
</html>
