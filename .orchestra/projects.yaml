# Каталог проектов Orchestra — единственный источник истины о том, что человек
# называет «проектом». Правится РУКАМИ, живёт в git, виден в диффе.
#
# Как это читать:
#   tag             — короткое имя проекта. Оно же в UI, оно же в task_list(project=...).
#                     Словарь тегов ЗАКРЫТ: тега вне этого файла не существует.
#   scope           — каталог на диске. Есть scope → проект принимает новые задачи из него.
#                     Уникален. Пишется ТОЧНО так, как он на диске (регистр важен).
#   write_namespace — пространство номеров, куда уходит номер НОВОЙ задачи.
#                     Обязателен при наличии scope. Менять нельзя: номер неизменяем.
#   namespaces      — все пространства номеров этого проекта и метка источника для
#                     каждого. Метка печатается рядом с номером, потому что номер
#                     уникален только внутри пространства: `#161 · ноутбук` и `#161`
#                     — разные задачи. Пустая метка = текущее пространство, без пометки.
#   archived        — проект закрыт: новых задач не принимает, в списках не предлагается.
#
# Почему namespace нельзя слить с тегом: на 15.09.2026 внутри этих тегов 424
# конфликтующие ссылки `#N` на 857 задач из 1755 — замер в
# .orchestra/tasks/V-576/namespace-map.md.

