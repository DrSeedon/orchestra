<script>
const DATA = JSON.parse(document.getElementById('codemap-data').textContent);
const NODES = DATA.nodes, EDGES = DATA.edges, FLOWS = DATA.flows;
const BY = {}; NODES.forEach(n => BY[n.id] = n);
const COLOR = t => getComputedStyle(document.documentElement).getPropertyValue('--t-' + t).trim() || '#8b949e';
const NW = 188, NH = 46, XGAP = 212, YGAP = 104;

document.getElementById('repo').textContent = 'orchestra';
document.getElementById('commit').textContent = DATA.generated_from_commit.slice(0, 8);
document.getElementById('gen').textContent = DATA.generated_at;
document.getElementById('counts').textContent =
  NODES.length + ' узлов (' + NODES.filter(n => n.primary).length + ' основных) · ' +
  EDGES.length + ' связей · ' + FLOWS.length + ' потоков';

/* ── раскладка: слои по длиннейшему пути (обратные рёбра исключены) ── */
const back = new Set();
(function findBackEdges() {
  const out = {}; NODES.forEach(n => out[n.id] = []);
  EDGES.forEach((e, i) => out[e.from].push(i));
  const state = {}; // 0 — не был, 1 — в стеке, 2 — закрыт
  const walk = id => {
    state[id] = 1;
    for (const i of out[id]) {
      const to = EDGES[i].to;
      if (state[to] === 1) back.add(i);
      else if (!state[to]) walk(to);
    }
    state[id] = 2;
  };
  NODES.forEach(n => { if (!state[n.id]) walk(n.id); });
})();

const layer = {}; NODES.forEach(n => layer[n.id] = 0);
for (let pass = 0; pass < NODES.length; pass++) {
  let moved = false;
  EDGES.forEach((e, i) => {
    if (back.has(i) || !BY[e.from].primary || !BY[e.to].primary) return;
    if (layer[e.to] < layer[e.from] + 1) { layer[e.to] = layer[e.from] + 1; moved = true; }
  });
  if (!moved) break;
}
const maxPrimary = Math.max(...NODES.filter(n => n.primary).map(n => layer[n.id]));
NODES.filter(n => !n.primary).forEach(n => layer[n.id] = maxPrimary + 1);

const ranks = [];
NODES.forEach(n => (ranks[layer[n.id]] = ranks[layer[n.id]] || []).push(n.id));

/* Упорядочивание внутри ранга: барицентр + транспозиция (обмен соседей, пока
   это уменьшает число пересечений). Обе эвристики — стандартный Сугияма. */
const pos = {}; ranks.forEach(r => r.forEach((id, i) => pos[id] = i));
const nb = {}; NODES.forEach(n => nb[n.id] = { in: [], out: [] });
EDGES.forEach(e => { if (e.from !== e.to) { nb[e.from].out.push(e.to); nb[e.to].in.push(e.from); } });

function crossings(a, b) {
  // пары рёбер между соседними рангами a→b, идущие «внахлёст»
  const pairs = [];
  EDGES.forEach(e => {
    if (a.includes(e.from) && b.includes(e.to)) pairs.push([pos[e.from], pos[e.to]]);
    if (a.includes(e.to) && b.includes(e.from)) pairs.push([pos[e.to], pos[e.from]]);
  });
  let c = 0;
  for (let i = 0; i < pairs.length; i++)
    for (let j = i + 1; j < pairs.length; j++)
      if ((pairs[i][0] - pairs[j][0]) * (pairs[i][1] - pairs[j][1]) < 0) c++;
  return c;
}
function totalCrossings() {
  let c = 0;
  for (let i = 0; i + 1 < ranks.length; i++) c += crossings(ranks[i] || [], ranks[i + 1] || []);
  return c;
}
const before = totalCrossings();
for (let sweep = 0; sweep < 16; sweep++) {
  const down = sweep % 2 === 0;
  for (let li = 0; li < ranks.length; li++) {
    const rank = ranks[down ? li : ranks.length - 1 - li];
    if (!rank) continue;
    const bary = {};
    rank.forEach(id => {
      const src = (down ? nb[id].in : nb[id].out).filter(x => layer[x] !== layer[id]);
      bary[id] = src.length ? src.reduce((s, x) => s + pos[x], 0) / src.length : pos[id];
    });
    rank.sort((a, b) => bary[a] - bary[b] || a.localeCompare(b));
    rank.forEach((id, i) => pos[id] = i);
  }
  // транспозиция: меняем соседей местами, если пересечений стало меньше
  let improved = true, guard = 0;
  while (improved && guard++ < 8) {
    improved = false;
    for (let li = 0; li < ranks.length; li++) {
      const rank = ranks[li];
      if (!rank) continue;
      for (let i = 0; i + 1 < rank.length; i++) {
        const cur = (li ? crossings(ranks[li - 1], rank) : 0) +
                    (ranks[li + 1] ? crossings(rank, ranks[li + 1]) : 0);
        [rank[i], rank[i + 1]] = [rank[i + 1], rank[i]];
        rank.forEach((id, k) => pos[id] = k);
        const nxt = (li ? crossings(ranks[li - 1], rank) : 0) +
                    (ranks[li + 1] ? crossings(rank, ranks[li + 1]) : 0);
        if (nxt < cur) improved = true;
        else {
          [rank[i], rank[i + 1]] = [rank[i + 1], rank[i]];
          rank.forEach((id, k) => pos[id] = k);
        }
      }
    }
  }
}
const CROSSINGS = { before, after: totalCrossings() };
const widest = Math.max(...ranks.map(r => (r || []).length));
const P = {};
ranks.forEach((rank, ri) => (rank || []).forEach((id, i) => {
  P[id] = { x: 40 + (i + (widest - rank.length) / 2) * XGAP, y: 40 + ri * YGAP };
}));

/* ── отрисовка ── */
const svg = document.getElementById('g');
const NS = 'http://www.w3.org/2000/svg';
const mk = (t, a) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); return e; };
const root = mk('g', {});
const defs = mk('defs', {});
['#586069', '#f0883e', '#58a6ff'].forEach((c, i) => {
  const m = mk('marker', { id: 'ar' + i, viewBox: '0 0 10 10', refX: '9', refY: '5',
    markerWidth: '7', markerHeight: '7', orient: 'auto-start-reverse' });
  m.appendChild(mk('path', { d: 'M0,0 L10,5 L0,10 z', fill: c }));
  defs.appendChild(m);
});
svg.appendChild(defs); svg.appendChild(root);
const gZone = mk('g', {}), gEdge = mk('g', {}), gFlow = mk('g', {}), gNode = mk('g', {});
[gZone, gEdge, gFlow, gNode].forEach(g => root.appendChild(g));

/* граница системы: колонка внешних систем и хранилищ */
(function drawZone() {
  const ext = NODES.filter(n => !n.primary).map(n => P[n.id]);
  if (!ext.length) return;
  const x = Math.min(...ext.map(p => p.x)) - 18, y = Math.min(...ext.map(p => p.y)) - 34;
  const x2 = Math.max(...ext.map(p => p.x)) + NW + 18, y2 = Math.max(...ext.map(p => p.y)) + NH + 18;
  gZone.appendChild(mk('rect', { class: 'zone', x, y, width: x2 - x, height: y2 - y, rx: 10 }));
  const t = mk('text', { class: 'zone-lbl', x: x + 12, y: y + 20 });
  t.textContent = 'ГРАНИЦА СИСТЕМЫ · внешние зависимости и хранилища';
  gZone.appendChild(t);
})();

function path(e) {
  const a = P[e.from], b = P[e.to];
  if (b.y > a.y) {                       // сверху вниз — обычное ребро
    const x1 = a.x + NW / 2, y1 = a.y + NH, x2 = b.x + NW / 2, y2 = b.y;
    const dy = Math.max(28, (y2 - y1) / 2);
    return `M${x1},${y1} C${x1},${y1 + dy} ${x2},${y2 - dy} ${x2},${y2}`;
  }
  const side = a.x <= b.x ? -1 : 1;      // обратное ребро — обходим сбоку
  const lift = 70 + Math.abs(a.y - b.y) / 3;
  const ax = a.x + (side < 0 ? 0 : NW), bx = b.x + (side < 0 ? 0 : NW);
  const ay = a.y + NH / 2, by = b.y + NH / 2;
  return `M${ax},${ay} C${ax + side * lift},${ay} ${bx + side * lift},${by} ${bx},${by}`;
}
const edgeEls = EDGES.map(e => {
  const p = mk('path', { class: 'edge' + (e.unknown ? ' unknown' : ''), d: path(e),
    stroke: e.unknown ? '#f0883e' : '#586069', 'marker-end': 'url(#ar' + (e.unknown ? 1 : 0) + ')' });
  const title = mk('title', {});
  title.textContent = `${e.from} —${e.type}→ ${e.to}` + (e.note ? `\n${e.note}` : '') +
    (e.unknown ? '\n[unknown: связь без доказательства в исходниках]' : '') +
    e.evidence.map(x => `\n${x.path}:${x.line} · ${x.symbol}`).join('');
  p.appendChild(title);
  gEdge.appendChild(p);
  return p;
});

const nodeEls = {};
NODES.forEach(n => {
  const g = mk('g', { class: 'node', transform: `translate(${P[n.id].x},${P[n.id].y})` });
  const c = COLOR(n.type);
  g.appendChild(mk('rect', { width: NW, height: NH, rx: 8, fill: c + '22', stroke: c,
    'stroke-dasharray': n.primary ? '' : '5 4' }));
  const l = mk('text', { class: 'lbl', x: 12, y: 20 }); l.textContent = n.label;
  const s = mk('text', { class: 'sub', x: 12, y: 36 });
  s.textContent = n.files.length > 1 ? `${n.path} +${n.files.length - 1}` : n.path;
  g.appendChild(l); g.appendChild(s);
  g.addEventListener('click', ev => { ev.stopPropagation(); select(n.id); });
  g.addEventListener('mousedown', ev => startDragNode(ev, n.id));
  gNode.appendChild(g);
  nodeEls[n.id] = g;
});

/* ── подсветка ── */
let selected = null, activeFlow = null;
function clearHighlight() {
  NODES.forEach(n => nodeEls[n.id].classList.remove('dim'));
  edgeEls.forEach((p, i) => { p.classList.remove('dim', 'hot');
    p.setAttribute('stroke', EDGES[i].unknown ? '#f0883e' : '#586069');
    p.setAttribute('marker-end', 'url(#ar' + (EDGES[i].unknown ? 1 : 0) + ')'); });
  gFlow.textContent = '';
}
function select(id) {
  activeFlow = null; document.querySelectorAll('.flow').forEach(f => f.classList.remove('on'));
  selected = id; clearHighlight();
  const up = new Set(), down = new Set();
  EDGES.forEach(e => { if (e.to === id) up.add(e.from); if (e.from === id) down.add(e.to); });
  const keep = new Set([id, ...up, ...down]);
  NODES.forEach(n => { if (!keep.has(n.id)) nodeEls[n.id].classList.add('dim'); });
  edgeEls.forEach((p, i) => {
    const e = EDGES[i];
    if (e.from === id || e.to === id) {
      p.classList.add('hot');
      p.setAttribute('stroke', e.from === id ? '#58a6ff' : '#3fb950');
      p.setAttribute('marker-end', 'url(#ar2)');
    } else p.classList.add('dim');
  });
  showDetails(BY[id], [...up], [...down]);
}
function selectFlow(fi) {
  selected = null; activeFlow = fi; clearHighlight();
  document.querySelectorAll('.flow').forEach((f, i) => f.classList.toggle('on', i === fi));
  const f = FLOWS[fi], ids = f.steps.map(s => s.node), set = new Set(ids);
  NODES.forEach(n => { if (!set.has(n.id)) nodeEls[n.id].classList.add('dim'); });
  edgeEls.forEach(p => p.classList.add('dim'));
  for (let i = 0; i + 1 < ids.length; i++) {
    const a = ids[i], b = ids[i + 1];
    const idx = EDGES.findIndex(e => e.from === a && e.to === b);
    if (idx >= 0) {
      edgeEls[idx].classList.remove('dim'); edgeEls[idx].classList.add('hot');
      edgeEls[idx].setAttribute('stroke', '#f0883e');
      edgeEls[idx].setAttribute('marker-end', 'url(#ar1)');
    } else if (a !== b) {
      gFlow.appendChild(mk('path', { class: 'flowlink', d: path({ from: a, to: b }),
        'marker-end': 'url(#ar1)' }));
    }
  }
  ids.forEach((id, i) => {
    const p = P[id];
    gFlow.appendChild(mk('circle', { class: 'step-badge', cx: p.x + NW - 12, cy: p.y - 4, r: 9 }));
    const t = mk('text', { class: 'step-badge-t', x: p.x + NW - 12, y: p.y - 1,
      'text-anchor': 'middle' });
    t.textContent = i + 1; gFlow.appendChild(t);
  });
  const d = document.getElementById('details');
  d.innerHTML = `<h3>${esc(f.title)}</h3><div class="role">Триггер: ${esc(f.trigger)}</div>` +
    '<div class="k">Шаги</div><ol style="padding-left:18px;margin:0 0 8px">' +
    f.steps.map(s => `<li><b>${esc(BY[s.node].label)}</b> — ${esc(s.what)}</li>`).join('') +
    `</ol><div class="k">Итог</div><div>${esc(f.outcome)}</div>`;
}
const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
function showDetails(n, up, down) {
  const list = (title, arr, fmt) => arr.length
    ? `<div class="k">${title}</div><ul>${arr.map(fmt).join('')}</ul>` : '';
  const flows = FLOWS.filter(f => f.steps.some(s => s.node === n.id));
  document.getElementById('details').innerHTML =
    `<h3>${esc(n.label)} <span class="pill" style="color:${COLOR(n.type)}">${n.type}</span></h3>` +
    `<div class="role">${esc(n.role)}</div>` +
    (n.resource ? `<div class="k">Ресурс</div><div>${esc(n.resource)}</div>` : '') +
    list('Файлы модуля', n.files, f => `<li>${esc(f)}</li>`) +
    list('Точки входа', n.entrypoints, f => `<li>${esc(f)}</li>`) +
    list('Кто вызывает (upstream)', up, f => `<li>${esc(BY[f].label)}</li>`) +
    list('От чего зависит (downstream)', down, f => `<li>${esc(BY[f].label)}</li>`) +
    list('Тесты', n.tests, f => `<li>${esc(f)}</li>`) +
    list('Потоки', flows.map(f => f.title), f => `<li>${esc(f)}</li>`) +
    list('Ограничения', n.constraints, f => `<li class="warn">${esc(f)}</li>`) +
    list('Доказательства', n.evidence, e => `<li>${esc(e.path)}:${e.line} · ${esc(e.symbol)}</li>`);
}

/* ── легенда и фильтр по типам ── */
const types = [...new Set(NODES.map(n => n.type))];
const hidden = new Set();
const legend = document.getElementById('legend');
types.forEach(t => {
  const b = document.createElement('button');
  b.innerHTML = `<span class="dot" style="background:${COLOR(t)}"></span>${t}` +
    ` <span style="color:var(--muted)">${NODES.filter(n => n.type === t).length}</span>`;
  b.onclick = () => { hidden.has(t) ? hidden.delete(t) : hidden.add(t); b.classList.toggle('off'); applyFilter(); };
  legend.appendChild(b);
});
const q = document.getElementById('q');
q.addEventListener('input', applyFilter);
function visible(n) {
  if (hidden.has(n.type)) return false;
  const s = q.value.trim().toLowerCase();
  if (!s) return true;
  return (n.label + ' ' + n.id + ' ' + n.role + ' ' + n.files.join(' ') + ' ' +
    n.entrypoints.join(' ')).toLowerCase().includes(s);
}
function applyFilter() {
  const vis = {}; NODES.forEach(n => vis[n.id] = visible(n));
  NODES.forEach(n => nodeEls[n.id].style.display = vis[n.id] ? '' : 'none');
  edgeEls.forEach((p, i) => p.style.display = vis[EDGES[i].from] && vis[EDGES[i].to] ? '' : 'none');
}

/* ── список потоков ── */
const fw = document.getElementById('flows');
FLOWS.forEach((f, i) => {
  const d = document.createElement('div');
  d.className = 'flow';
  d.innerHTML = `<div class="t">${esc(f.title)}</div><div class="s">${f.steps.length} шагов</div>`;
  d.onclick = () => selectFlow(i);
  fw.appendChild(d);
});

/* ── зум, панорама, перетаскивание ── */
let view = { x: 0, y: 0, k: 1 };
function apply() { root.setAttribute('transform', `translate(${view.x},${view.y}) scale(${view.k})`); }
svg.addEventListener('wheel', ev => {
  ev.preventDefault();
  const r = svg.getBoundingClientRect(), mx = ev.clientX - r.left, my = ev.clientY - r.top;
  const k = Math.min(2.5, Math.max(0.2, view.k * (ev.deltaY < 0 ? 1.12 : 1 / 1.12)));
  view.x = mx - (mx - view.x) * k / view.k; view.y = my - (my - view.y) * k / view.k; view.k = k;
  apply();
}, { passive: false });
let pan = null;
svg.addEventListener('mousedown', ev => {
  if (ev.target.closest('.node')) return;
  pan = { x: ev.clientX - view.x, y: ev.clientY - view.y }; svg.classList.add('panning');
});
window.addEventListener('mousemove', ev => {
  if (drag) {
    const p = P[drag.id];
    p.x = drag.ox + (ev.clientX - drag.sx) / view.k;
    p.y = drag.oy + (ev.clientY - drag.sy) / view.k;
    nodeEls[drag.id].setAttribute('transform', `translate(${p.x},${p.y})`);
    edgeEls.forEach((el, i) => {
      if (EDGES[i].from === drag.id || EDGES[i].to === drag.id) el.setAttribute('d', path(EDGES[i]));
    });
  } else if (pan) { view.x = ev.clientX - pan.x; view.y = ev.clientY - pan.y; apply(); }
});
window.addEventListener('mouseup', () => { pan = null; drag = null; svg.classList.remove('panning'); });
let drag = null;
function startDragNode(ev, id) {
  ev.stopPropagation();
  drag = { id, sx: ev.clientX, sy: ev.clientY, ox: P[id].x, oy: P[id].y };
}
svg.addEventListener('click', ev => { if (!ev.target.closest('.node')) resetSelection(); });
function resetSelection() {
  selected = null; activeFlow = null; clearHighlight();
  document.querySelectorAll('.flow').forEach(f => f.classList.remove('on'));
  document.getElementById('details').innerHTML =
    '<div class="empty">Клик по узлу — связи, тесты и потоки. Клик по потоку — весь путь.</div>';
}
function fit() {
  const xs = NODES.map(n => P[n.id].x), ys = NODES.map(n => P[n.id].y);
  const w = Math.max(...xs) + NW + 60, h = Math.max(...ys) + NH + 60;
  const r = svg.getBoundingClientRect();
  view.k = Math.min(1, Math.min(r.width / w, r.height / h));
  view.x = (r.width - w * view.k) / 2; view.y = (r.height - h * view.k) / 2 + 10;
  apply();
}
document.getElementById('reset').onclick = () => { q.value = ''; hidden.clear();
  document.querySelectorAll('.legend button').forEach(b => b.classList.remove('off'));
  applyFilter(); resetSelection(); fit(); };
window.addEventListener('resize', fit);
fit();
</script>
</body>
</html>
