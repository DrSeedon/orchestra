<script>
const DATA = JSON.parse(document.getElementById('codemap-data').textContent);
const NODES = DATA.nodes, EDGES = DATA.edges, FLOWS = DATA.flows, GROUPS = DATA.groups;
const BY = {}; NODES.forEach(n => BY[n.id] = n);
const GI = {}; GROUPS.forEach((g, i) => GI[g.id] = i);
/* размер узла несёт вес: 3 — узловая точка системы, 2 — модуль, 1 — граница */
const SIZE = { 3: { w: 214, fs: 14.5, sf: 11.5 }, 2: { w: 192, fs: 13.5, sf: 11 }, 1: { w: 174, fs: 12.5, sf: 10.5 } };
const GAP_X = 58, GAP_Y = 26, PAD = 34, LANE_TOP = 46, LOOP = 54;

document.getElementById('repo').textContent = 'orchestra';
document.getElementById('summary').textContent = DATA.summary;
document.getElementById('commit').textContent = DATA.generated_from_commit.slice(0, 8);
document.getElementById('gen').textContent = DATA.generated_at;
document.getElementById('counts').textContent =
  NODES.length + ' узлов (' + NODES.filter(n => n.primary).length + ' основных) · ' +
  EDGES.length + ' связей · ' + FLOWS.length + ' потоков';
document.getElementById('fcount').textContent = FLOWS.length;

/* ── тема ── */
const themeBtn = document.getElementById('theme');
function setTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  themeBtn.textContent = t === 'dark' ? '☀ Светлая' : '🌙 Тёмная';
  try { localStorage.setItem('codemap-theme', t); } catch (e) {}
}
themeBtn.onclick = () => setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
try { setTheme(localStorage.getItem('codemap-theme') || 'dark'); } catch (e) { setTheme('dark'); }

/* ── что рисуем по умолчанию: костяк ──
   Костяк = шаги сквозных потоков + структурные связи (imports/reads/writes/pub/sub)
   + всё, что пересекает границу системы. Прячутся только рядовые calls, не попавшие
   ни в один поток: их 30+, и именно они превращали карту в клубок. */
const flowPairs = new Set();
FLOWS.forEach(f => { const s = f.steps.map(x => x.node);
  for (let i = 0; i + 1 < s.length; i++) if (s[i] !== s[i + 1]) flowPairs.add(s[i] + '>' + s[i + 1]); });
const onFlow = EDGES.map(e => flowPairs.has(e.from + '>' + e.to));
const inSkeleton = EDGES.map((e, i) => onFlow[i] || e.type !== 'calls' ||
  !BY[e.from].primary || !BY[e.to].primary);
let mode = 'skeleton';
const skelCount = inSkeleton.filter(Boolean).length;
document.getElementById('m-skeleton').textContent = 'Костяк · ' + skelCount;
document.getElementById('m-all').textContent = 'Все связи · ' + EDGES.length;

/* ── раскладка: колонка на группу, слева направо ── */
const ranks = GROUPS.map(g => NODES.filter(n => n.group === g.id).map(n => n.id));
const layer = {}; NODES.forEach(n => layer[n.id] = GI[n.group]);
const pos = {}; ranks.forEach(r => r.forEach((id, i) => pos[id] = i));
const nb = {}; NODES.forEach(n => nb[n.id] = { in: [], out: [] });
EDGES.forEach(e => { if (e.from !== e.to) { nb[e.from].out.push(e.to); nb[e.to].in.push(e.from); } });

/* порядок внутри колонки: барицентр + транспозиция (стандартный Сугияма) */
function crossings(a, b) {
  const pairs = [];
  EDGES.forEach(e => {
    if (a.includes(e.from) && b.includes(e.to)) pairs.push([pos[e.from], pos[e.to]]);
    if (a.includes(e.to) && b.includes(e.from)) pairs.push([pos[e.to], pos[e.from]]);
  });
  let c = 0;
  for (let i = 0; i < pairs.length; i++)
    for (let j = i + 1; j < pairs.length; j++)
      if ((pairs[i][0] - pairs[j][0]) * (pairs[i][1] - pairs[j][1]) < 0) c++;
  return c;
}
function totalCrossings() {
  let c = 0;
  for (let i = 0; i + 1 < ranks.length; i++) c += crossings(ranks[i], ranks[i + 1]);
  return c;
}
const CROSSINGS = { before: totalCrossings() };
for (let sweep = 0; sweep < 16; sweep++) {
  const down = sweep % 2 === 0;
  for (let li = 0; li < ranks.length; li++) {
    const rank = ranks[down ? li : ranks.length - 1 - li];
    const bary = {};
    rank.forEach(id => {
      const src = (down ? nb[id].in : nb[id].out).filter(x => layer[x] !== layer[id]);
      bary[id] = src.length ? src.reduce((s, x) => s + pos[x], 0) / src.length : pos[id];
    });
    rank.sort((a, b) => bary[a] - bary[b] || a.localeCompare(b));
    rank.forEach((id, i) => pos[id] = i);
  }
  let improved = true, guard = 0;
  while (improved && guard++ < 8) {
    improved = false;
    for (let li = 0; li < ranks.length; li++) {
      const rank = ranks[li];
      for (let i = 0; i + 1 < rank.length; i++) {
        const cur = (li ? crossings(ranks[li - 1], rank) : 0) +
                    (ranks[li + 1] ? crossings(rank, ranks[li + 1]) : 0);
        [rank[i], rank[i + 1]] = [rank[i + 1], rank[i]];
        rank.forEach((id, k) => pos[id] = k);
        const nxt = (li ? crossings(ranks[li - 1], rank) : 0) +
                    (ranks[li + 1] ? crossings(rank, ranks[li + 1]) : 0);
        if (nxt < cur) improved = true;
        else { [rank[i], rank[i + 1]] = [rank[i + 1], rank[i]];
               rank.forEach((id, k) => pos[id] = k); }
      }
    }
  }
}
CROSSINGS.after = totalCrossings();

/* перенос подписи по словам: длинное имя не вылезает за рамку, а растит высоту */
function wrap(text, maxChars) {
  const out = [];
  let line = '';
  for (const w of text.split(' ')) {
    if (line && (line + ' ' + w).length > maxChars) { out.push(line); line = w; }
    else line = line ? line + ' ' + w : w;
  }
  if (line) out.push(line);
  return out.slice(0, 2);
}
const D = {};   // геометрия узла: x, y, w, h + строки подписи
NODES.forEach(n => {
  const s = SIZE[n.weight];
  const lines = wrap(n.label, Math.floor((s.w - 22) / (s.fs * 0.62)));
  const sub = n.files.length > 1 ? n.path + ' +' + (n.files.length - 1) : n.path;
  D[n.id] = { w: s.w, fs: s.fs, sf: s.sf, lines, sub,
              h: 16 + lines.length * (s.fs + 4) + 19 };
});
const laneW = ranks.map(r => Math.max(...r.map(id => D[id].w)));
const laneH = ranks.map(r => r.reduce((s, id) => s + D[id].h, 0) + (r.length - 1) * GAP_Y);
const maxH = Math.max(...laneH);
const NEAR = Math.max(...laneW) + GAP_X;   // «через одну колонку» для обратных рёбер
const laneX = []; let cx = PAD;
laneW.forEach((w, i) => { laneX[i] = cx; cx += w + GAP_X; });
const W = cx - GAP_X + PAD, H = PAD + LANE_TOP + maxH + LOOP + PAD;
ranks.forEach((rank, ri) => {
  let y = PAD + LANE_TOP + (maxH - laneH[ri]) / 2;
  rank.forEach(id => {
    D[id].x = laneX[ri] + (laneW[ri] - D[id].w) / 2;
    D[id].y = y;
    y += D[id].h + GAP_Y;
  });
});

/* ── отрисовка ── */
const svg = document.getElementById('g');
const NS = 'http://www.w3.org/2000/svg';
const mk = (t, a) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); return e; };
const root = mk('g', {});
const defs = mk('defs', {});
const marker = mk('marker', { id: 'ar', viewBox: '0 0 10 10', refX: '9', refY: '5',
  markerWidth: '6', markerHeight: '6', orient: 'auto-start-reverse' });
marker.appendChild(mk('path', { d: 'M0,0 L10,5 L0,10 z', fill: 'context-stroke' }));
defs.appendChild(marker);
svg.appendChild(defs); svg.appendChild(root);
const gLane = mk('g', {}), gEdge = mk('g', {}), gFlow = mk('g', {}), gNode = mk('g', {});
[gLane, gEdge, gFlow, gNode].forEach(g => root.appendChild(g));

GROUPS.forEach((g, i) => {
  const x = laneX[i] - 16, w = laneW[i] + 32;
  gLane.appendChild(mk('rect', { class: 'lane', x, y: PAD - 8, width: w,
    height: LANE_TOP + maxH + 16, rx: 12,
    'stroke-dasharray': g.id === 'boundary' ? '7 6' : '' }));
  const t = mk('text', { class: 'lane-lbl', x: x + 14, y: PAD + 14 });
  t.textContent = (i + 1) + '. ' + g.label.toUpperCase();
  const h = mk('text', { class: 'lane-hint', x: x + 14, y: PAD + 31 });
  h.textContent = g.hint;
  gLane.appendChild(t); gLane.appendChild(h);
});

function path(e) {
  const a = D[e.from], b = D[e.to];
  const ax2 = a.x + a.w, bx2 = b.x + b.w;
  const ay = a.y + a.h / 2, by = b.y + b.h / 2;
  if (b.x >= ax2 + 8) {                             // вперёд: правый бок → левый бок
    const dx = Math.max(38, (b.x - ax2) / 2);
    return `M${ax2},${ay} C${ax2 + dx},${ay} ${b.x - dx},${by} ${b.x},${by}`;
  }
  if (bx2 > a.x - 8) {                              // колонки перекрываются: дуга слева
    const lift = Math.min(30, 14 + Math.abs(by - ay) / 9);
    return `M${a.x},${ay} C${a.x - lift},${ay} ${b.x - lift},${by} ${b.x},${by}`;
  }
  if (a.x - bx2 < NEAR) {                           // назад на соседнюю колонку: короткая дуга
    const lift = 30 + Math.abs(by - ay) / 6;
    return `M${a.x},${ay} C${a.x - lift},${ay + 26} ${bx2 + lift},${by + 26} ${bx2},${by}`;
  }
  const drop = LOOP + Math.abs(ax2 - bx2) / 14;     // назад далеко: петля под лентами
  return `M${a.x + a.w / 2},${a.y + a.h} C${a.x + a.w / 2},${a.y + a.h + drop} ` +
         `${b.x + b.w / 2},${b.y + b.h + drop} ${b.x + b.w / 2},${b.y + b.h}`;
}
const edgeEls = EDGES.map((e, i) => {
  const p = mk('path', { class: 'edge e-' + e.type + (e.unknown ? ' unknown' : '') +
    (onFlow[i] ? ' onflow' : ''), d: path(e), 'marker-end': 'url(#ar)' });
  const title = mk('title', {});
  title.textContent = `${e.from} —${e.type}→ ${e.to}` + (e.note ? `\n${e.note}` : '') +
    (e.unknown ? '\n[unknown: связь без доказательства в исходниках]' : '') +
    e.evidence.map(x => `\n${x.path}:${x.line} · ${x.symbol}`).join('');
  p.appendChild(title);
  gEdge.appendChild(p);
  return p;
});

const nodeEls = {};
NODES.forEach(n => {
  const d = D[n.id];
  const g = mk('g', { class: 'node w' + n.weight, transform: `translate(${d.x},${d.y})` });
  g.style.color = `var(--t-${n.type})`;   // fill/stroke берут currentColor → тема живая
  g.appendChild(mk('rect', { width: d.w, height: d.h, rx: 9, fill: 'currentColor',
    stroke: 'currentColor', 'stroke-dasharray': n.primary ? '' : '5 4' }));
  d.lines.forEach((ln, i) => {
    const l = mk('text', { class: 'lbl', x: 11, y: 16 + (i + 1) * (d.fs + 4) - 5,
      'font-size': d.fs });
    l.textContent = ln; g.appendChild(l);
  });
  const s = mk('text', { class: 'sub', x: 11, y: d.h - 10, 'font-size': d.sf });
  s.textContent = d.sub; g.appendChild(s);
  g.addEventListener('click', ev => { ev.stopPropagation(); select(n.id); });
  g.addEventListener('mousedown', ev => startDragNode(ev, n.id));
  g.addEventListener('mouseenter', () => { if (!selected && !activeFlow) focus(n.id, false); });
  g.addEventListener('mouseleave', () => { if (!selected && !activeFlow) clearHighlight(); });
  gNode.appendChild(g);
  nodeEls[n.id] = g;
});
/* ── подсветка ── */
let selected = null, activeFlow = null;
function clearHighlight() {
  NODES.forEach(n => nodeEls[n.id].classList.remove('dim'));
  edgeEls.forEach(p => p.classList.remove('dim', 'hot', 'up', 'down'));
  gFlow.textContent = '';
  applyMode();
}
function focus(id, withDetails) {
  clearHighlight();
  const up = new Set(), down = new Set();
  EDGES.forEach(e => { if (e.to === id) up.add(e.from); if (e.from === id) down.add(e.to); });
  const keep = new Set([id, ...up, ...down]);
  NODES.forEach(n => { if (!keep.has(n.id)) nodeEls[n.id].classList.add('dim'); });
  edgeEls.forEach((p, i) => {
    const e = EDGES[i];
    if (e.from === id || e.to === id) {
      p.classList.remove('hidden');                 // связи выбранного видно всегда
      p.classList.add('hot', e.from === id ? 'down' : 'up');
    } else p.classList.add('dim');
  });
  if (withDetails) showDetails(BY[id], [...up], [...down]);
}
function select(id) {
  activeFlow = null; document.querySelectorAll('.flow').forEach(f => f.classList.remove('on'));
  selected = id;
  focus(id, true);
}
function paintFlow(fi) {
  clearHighlight();
  const f = FLOWS[fi], ids = f.steps.map(s => s.node), set = new Set(ids);
  NODES.forEach(n => { if (!set.has(n.id)) nodeEls[n.id].classList.add('dim'); });
  edgeEls.forEach(p => p.classList.add('dim'));
  for (let i = 0; i + 1 < ids.length; i++) {
    const a = ids[i], b = ids[i + 1];
    const idx = EDGES.findIndex(e => e.from === a && e.to === b);
    if (idx >= 0) {
      edgeEls[idx].classList.remove('dim', 'hidden');
      edgeEls[idx].classList.add('hot', 'flowhot');
    } else if (a !== b) {
      gFlow.appendChild(mk('path', { class: 'flowlink', d: path({ from: a, to: b }),
        'marker-end': 'url(#ar)' }));
    }
  }
  ids.forEach((id, i) => {
    const d = D[id];
    gFlow.appendChild(mk('circle', { class: 'step-badge', cx: d.x + d.w - 13, cy: d.y - 5, r: 10 }));
    const t = mk('text', { class: 'step-badge-t', x: d.x + d.w - 13, y: d.y - 1,
      'text-anchor': 'middle' });
    t.textContent = i + 1; gFlow.appendChild(t);
  });
}
function selectFlow(fi) {
  selected = null; activeFlow = FLOWS[fi];
  document.querySelectorAll('.flow').forEach((f, i) => f.classList.toggle('on', i === fi));
  paintFlow(fi);
  const f = FLOWS[fi], d = document.getElementById('details');
  d.innerHTML = `<h3>${esc(f.title)}</h3><div class="role">Триггер: ${esc(f.trigger)}</div>` +
    '<div class="k">Шаги</div><ol style="padding-left:18px;margin:0 0 8px;color:var(--sub)">' +
    f.steps.map(s => `<li><b>${esc(BY[s.node].label)}</b> — ${esc(s.what)}</li>`).join('') +
    `</ol><div class="k">Итог</div><div>${esc(f.outcome)}</div>`;
  d.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
function showDetails(n, up, down) {
  const list = (title, arr, fmt) => arr.length
    ? `<div class="k">${title}</div><ul>${arr.map(fmt).join('')}</ul>` : '';
  const flows = FLOWS.filter(f => f.steps.some(s => s.node === n.id));
  const g = GROUPS[GI[n.group]];
  document.getElementById('details').innerHTML =
    `<h3>${esc(n.label)} <span class="pill" style="color:var(--t-${n.type})">${n.type}</span></h3>` +
    `<div class="role">${esc(g.label)} · ${esc(n.role)}</div>` +
    (n.resource ? `<div class="k">Ресурс</div><div>${esc(n.resource)}</div>` : '') +
    list('Файлы модуля', n.files, f => `<li>${esc(f)}</li>`) +
    list('Точки входа', n.entrypoints, f => `<li>${esc(f)}</li>`) +
    list('Кто вызывает (upstream)', up, f => `<li>${esc(BY[f].label)}</li>`) +
    list('От чего зависит (downstream)', down, f => `<li>${esc(BY[f].label)}</li>`) +
    list('Тесты', n.tests, f => `<li>${esc(f)}</li>`) +
    list('Потоки', flows.map(f => f.title), f => `<li>${esc(f)}</li>`) +
    list('Ограничения', n.constraints, f => `<li class="warn">${esc(f)}</li>`) +
    list('Доказательства', n.evidence, e => `<li>${esc(e.path)}:${e.line} · ${esc(e.symbol)}</li>`);
  document.getElementById('details').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

/* ── легенды ── */
const ETYPES = { imports: 'imports — импорт модуля', calls: 'calls — вызов функции',
  reads: 'reads — читает данные', writes: 'writes — пишет данные',
  publishes: 'publishes — публикует событие', subscribes: 'subscribes — подписан на поток' };
const el = document.getElementById('elegend');
Object.keys(ETYPES).forEach(t => {
  const n = EDGES.filter(e => e.type === t).length;
  if (!n) return;
  const s = document.createElementNS(NS, 'svg');
  s.setAttribute('viewBox', '0 0 34 8');
  s.appendChild(mk('path', { class: 'edge e-' + t, d: 'M0,4 L32,4',
    style: 'opacity:1;stroke-width:2', 'marker-end': 'url(#ar)' }));
  const box = document.createElement('div'); box.appendChild(s);
  const lbl = document.createElement('div'); lbl.textContent = ETYPES[t] + ' · ' + n;
  el.appendChild(box); el.appendChild(lbl);
});
const types = [...new Set(NODES.map(n => n.type))];
const hidden = new Set();
const legend = document.getElementById('legend');
types.forEach(t => {
  const b = document.createElement('button');
  b.innerHTML = `<span class="dot" style="background:var(--t-${t})"></span>${t}` +
    ` <span style="color:var(--muted)">${NODES.filter(n => n.type === t).length}</span>`;
  b.onclick = () => { hidden.has(t) ? hidden.delete(t) : hidden.add(t); b.classList.toggle('off'); applyFilter(); };
  legend.appendChild(b);
});
const q = document.getElementById('q');
q.addEventListener('input', applyFilter);
function visible(n) {
  if (hidden.has(n.type)) return false;
  const s = q.value.trim().toLowerCase();
  if (!s) return true;
  return (n.label + ' ' + n.id + ' ' + n.role + ' ' + n.files.join(' ') + ' ' +
    n.entrypoints.join(' ')).toLowerCase().includes(s);
}
let vis = {};
function applyFilter() {
  NODES.forEach(n => vis[n.id] = visible(n));
  NODES.forEach(n => nodeEls[n.id].style.display = vis[n.id] ? '' : 'none');
  applyMode();
}
function applyMode() {
  edgeEls.forEach((p, i) => {
    const e = EDGES[i];
    const show = vis[e.from] !== false && vis[e.to] !== false &&
      (mode === 'all' || inSkeleton[i]);
    p.classList.toggle('hidden', !show);
  });
}
function setMode(m) {
  mode = m;
  document.getElementById('m-skeleton').classList.toggle('on', m === 'skeleton');
  document.getElementById('m-all').classList.toggle('on', m === 'all');
  applyMode();
  if (selected) select(selected);
}
document.getElementById('m-skeleton').onclick = () => setMode('skeleton');
document.getElementById('m-all').onclick = () => setMode('all');

/* ── список потоков ── */
const fw = document.getElementById('flows');
FLOWS.forEach((f, i) => {
  const d = document.createElement('div');
  d.className = 'flow';
  d.innerHTML = `<div class="num">${i + 1}</div><div><div class="t">${esc(f.title)}</div>` +
    `<div class="s">${f.steps.length} шагов</div></div>`;
  d.onclick = () => selectFlow(i);
  d.onmouseenter = () => { if (!selected && !activeFlow) paintFlow(i); };
  d.onmouseleave = () => { if (!selected && !activeFlow) clearHighlight(); };
  fw.appendChild(d);
});

/* ── зум, панорама, перетаскивание ── */
let view = { x: 0, y: 0, k: 1 };
function apply() { root.setAttribute('transform', `translate(${view.x},${view.y}) scale(${view.k})`); }
svg.addEventListener('wheel', ev => {
  ev.preventDefault();
  const r = svg.getBoundingClientRect(), mx = ev.clientX - r.left, my = ev.clientY - r.top;
  const k = Math.min(2.5, Math.max(0.2, view.k * (ev.deltaY < 0 ? 1.12 : 1 / 1.12)));
  view.x = mx - (mx - view.x) * k / view.k; view.y = my - (my - view.y) * k / view.k; view.k = k;
  apply();
}, { passive: false });
let pan = null, drag = null;
svg.addEventListener('mousedown', ev => {
  if (ev.target.closest('.node')) return;
  pan = { x: ev.clientX - view.x, y: ev.clientY - view.y }; svg.classList.add('panning');
});
window.addEventListener('mousemove', ev => {
  if (drag) {
    const d = D[drag.id];
    d.x = drag.ox + (ev.clientX - drag.sx) / view.k;
    d.y = drag.oy + (ev.clientY - drag.sy) / view.k;
    nodeEls[drag.id].setAttribute('transform', `translate(${d.x},${d.y})`);
    edgeEls.forEach((el, i) => {
      if (EDGES[i].from === drag.id || EDGES[i].to === drag.id) el.setAttribute('d', path(EDGES[i]));
    });
  } else if (pan) { view.x = ev.clientX - pan.x; view.y = ev.clientY - pan.y; apply(); }
});
window.addEventListener('mouseup', () => { pan = null; drag = null; svg.classList.remove('panning'); });
function startDragNode(ev, id) {
  ev.stopPropagation();
  drag = { id, sx: ev.clientX, sy: ev.clientY, ox: D[id].x, oy: D[id].y };
}
svg.addEventListener('click', ev => { if (!ev.target.closest('.node')) resetSelection(); });
function resetSelection() {
  selected = null; activeFlow = null; clearHighlight();
  document.querySelectorAll('.flow').forEach(f => f.classList.remove('on'));
  document.getElementById('details').innerHTML =
    '<div class="empty">Клик по узлу — связи, тесты, потоки и доказательства.</div>';
}
function fit() {
  const r = svg.getBoundingClientRect();
  view.k = Math.min(1.15, Math.min(r.width / W, r.height / H));
  view.x = (r.width - W * view.k) / 2; view.y = (r.height - H * view.k) / 2;
  apply();
}
document.getElementById('reset').onclick = () => { q.value = ''; hidden.clear();
  document.querySelectorAll('.legend button').forEach(b => b.classList.remove('off'));
  setMode('skeleton'); applyFilter(); resetSelection(); fit(); };
function layout() {
  document.getElementById('app').style.height =
    (window.innerHeight - document.querySelector('header').offsetHeight) + 'px';
  fit();
}
window.addEventListener('resize', layout);
applyFilter();
layout();
</script>
</body>
</html>
