# Observe-only defaults. Arming requires BOTH ENABLED=true and DRY_RUN=false.
ENABLED=false
DRY_RUN=true

TARGET_CGROUP=/system.slice/orchestra.service
TARGET_EXE=/usr/lib/node_modules/@anthropic-ai/claude-code/bin/claude.exe
TARGET_ARGV0=ugrep

# Provisional Phase 1 hypotheses; armed values require T2 direct observation.
MAX_AGE_SEC=181
MAX_RSS_KIB=528578
POLL_SEC=10
RSS_ACTION=log

# Only used when armed. The guard freezes its own temporary child cgroup, never the service cgroup.
# T2 must calibrate this on a synthetic cgroup first.
FREEZE_TIMEOUT_SEC=2
FREEZE_MARKER=/run/orchestra-process-guard/freeze-owned
