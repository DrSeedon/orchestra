# Apply only in the same controlled window as an Orchestra restart. The current process may
# already exceed these limits in cold swap; daemon-reloading them onto that process is unsafe.
[Service]
Environment=MALLOC_ARENA_MAX=2
Environment=MALLOC_TRIM_THRESHOLD_=131072
MemoryHigh=8G
MemoryMax=12G
MemorySwapMax=4G
OOMScoreAdjust=800
