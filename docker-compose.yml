services:
  orchestra:
    build: .
    ports:
      - "8888:8888"
    volumes:
      - ./data:/app/data
      - ./worktrees:/app/worktrees
      - ./.env:/app/.env
      # Mount git config so Claude CLI can create commits inside worktrees
      - /etc/gitconfig:/etc/gitconfig:ro
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
