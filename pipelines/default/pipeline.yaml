name: default
description: Upstream pipeline v2.16 (orchestrator / sub-orchestrator / worker / full-cycle / reviewer / watcher). Behaviour 1:1 with mccalpink/orchestra main.
validation: fail-open
defaults:
  model: opus
  skills: []
  mcp_servers: []
  inherit_claude_md: true
  prompt_layers:
    orchestrator: [base.md, "roles/{role}.md"]
    worker:       [base.md, "roles/{role}.md"]
  worktree:
    symlinks: []
    copies:   [CLAUDE.md, .mcp.json, .env, .worktreeinclude]
  base_branch_strategy: main
  docs_scaffold: false
roles:
  orchestrator:
    kind: orchestrator
    label: Orchestrator
    order: 0
    model: opus
    skills: [html-artifacts, vps-deploy]
    modules: [git-workflow]
    can_spawn: ["*"]
    allow_unrouted_workers: true
    when: Managing a team of workers, decomposing tasks, approving plans
    not_for: Direct implementation — delegate to workers
    description: >
      Manages worker agents. Decomposes tasks, spawns workers, reviews results.
      Available worker roles are injected automatically from roles/ directory.
  sub-orchestrator:
    kind: orchestrator
    label: Sub-Orchestrator
    order: 1
    model: opus
    modules: [git-workflow]
    can_spawn: ["*"]
    allow_unrouted_workers: true
    tg: {emoji: "🎯"}
    when: Managing a sub-team within a larger hierarchy (department lead, tech lead, team lead)
    not_for: Direct implementation — delegate to workers
    description: >
      Manages a subset of workers under a parent orchestrator.
      Reports up to parent, delegates down to workers.
  worker:
    kind: worker
    label: Worker
    order: 2
    model: sonnet
    modules: [git-workflow, codex-review, report-format]
    can_spawn: []
    allow_unrouted_workers: false
    when: Clear task for a known module, implementation from detailed spec, bug fix with known repro
    not_for: Tasks needing research or unknown scope — use full-cycle
    description: >
      General-purpose worker. Implements tasks directly, no pipeline gates.
  full-cycle:
    kind: worker
    label: Full-Cycle
    order: 3
    model: opus
    modules: [git-workflow, codex-review, report-format]
    can_spawn: []
    allow_unrouted_workers: false
    when: New feature with unknowns, large refactoring (5+ files), external integration
    not_for: Bug fixes, config changes, implementation from clear spec
    description: >
      Research -> Plan + Codex review -> Implement + Codex review.
      Strict 3-phase pipeline with 2 orchestrator approval gates. Artifacts in docs/tasks/<id>/.
  reviewer:
    kind: worker
    label: Reviewer
    order: 4
    model: opus
    modules: [codex-review]
    can_spawn: []
    allow_unrouted_workers: false
    tg: {emoji: "🔍"}
    when: Code review, PR review, architecture review
    not_for: Implementation — only reviews
    description: >
      Reviews code, plans, and architectures. Does not implement.
      Reports findings to orchestrator.
  watcher:
    kind: worker
    label: Watcher
    order: 5
    model: haiku
    can_spawn: []
    allow_unrouted_workers: false
    tg: {emoji: "👁️"}
    when: Monitoring logs, watching for events, background surveillance
    not_for: Implementation or review — only observes and reports
    description: >
      Monitors systems and reports anomalies. Lightweight background agent.
