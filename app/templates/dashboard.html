<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <title>🎼 Orchestra</title>
    <script src="/static/css/vendor/tailwind.js"></script>
    <script src="/static/css/vendor/marked.min.js"></script>
    <script src="/static/css/vendor/purify.min.js"></script>
    <script src="/static/css/vendor/diff_match_patch.js"></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="h-screen flex flex-col">
    <header class="flex items-center justify-between px-5 py-2 border-b border-slate-800/50">
        <div class="flex items-center gap-2 flex-1 min-w-0">
            <h1 class="text-lg font-bold tracking-tight shrink-0">🎼</h1>
            <div id="orch-tabs" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar"></div>
            <select id="orch-picker" class="hidden"></select>
            <button id="new-orch-btn" class="px-2.5 py-1.5 bg-slate-800/50 hover:bg-slate-700 border border-dashed border-slate-700 rounded-full text-xs transition-colors shrink-0" title="New orchestrator">+</button>
            <button id="delete-orch-btn" class="px-2 py-1.5 hover:bg-red-900/40 rounded-full text-xs transition-colors text-red-400/60 hover:text-red-400 shrink-0" title="Delete current">✕</button>
        </div>
        <div class="flex items-center gap-3 text-xs text-slate-600 shrink-0">
            <span id="stats-line"></span>
            <button id="compact-toggle-btn" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-lg transition-colors text-slate-400" title="Toggle compact tool view">📋</button>
            <button id="restart-btn" class="px-2 py-1 bg-slate-800 hover:bg-amber-900/60 border border-slate-700 rounded-lg transition-colors text-amber-400" title="Restart Orchestra server">⟳</button>
        </div>
    </header>

    <!-- New Orchestrator Modal -->
    <div id="new-orch-modal" class="fixed inset-0 bg-black/60 backdrop-filter backdrop-blur-sm z-50 items-center justify-center hidden">
        <div class="glass glow rounded-xl p-6 w-[420px]">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-sm font-bold">New Orchestrator</h2>
                <button id="modal-close" class="text-slate-500 hover:text-white text-lg">✕</button>
            </div>
            <div class="space-y-3">
                <div>
                    <label class="text-xs text-slate-500 block mb-1">Name</label>
                    <input id="orch-name" type="text" class="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-lg text-sm focus:border-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="text-xs text-slate-500 block mb-1">Project path</label>
                    <div class="flex gap-2">
                        <input id="orch-cwd" type="text" class="flex-1 px-3 py-2 bg-slate-900 border border-slate-800 rounded-lg text-sm focus:border-indigo-500 focus:outline-none" placeholder="Select or type path...">
                        <button id="browse-btn" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-lg text-xs transition-colors" title="Browse projects">📂</button>
                    </div>
                    <div id="project-picker" class="hidden mt-2 max-h-48 overflow-y-auto bg-slate-900 border border-slate-700 rounded-lg"></div>
                </div>
                <div>
                    <label class="text-xs text-slate-500 block mb-1">Model</label>
                    <select id="orch-model" class="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-lg text-sm focus:border-indigo-500 focus:outline-none">
                    </select>
                </div>
                <div id="orch-error" class="text-xs text-red-400 hidden"></div>
                <button id="create-orch-btn" class="w-full py-2 bg-indigo-600 hover:bg-indigo-500 rounded-lg text-sm font-medium transition-colors">Create Orchestrator</button>
            </div>
        </div>
    </div>

    <!-- Prompt Modal -->
    <div id="prompt-modal" class="fixed inset-0 bg-black/60 backdrop-filter backdrop-blur-sm z-50 items-center justify-center hidden">
      <div class="glass glow rounded-xl p-6 w-[90vw] max-w-4xl max-h-[85vh] flex flex-col">
        <div class="flex justify-between items-center mb-3">
          <span id="prompt-modal-name" class="text-indigo-300 font-bold text-sm"></span>
          <button id="prompt-modal-close" class="text-slate-400 hover:text-white text-lg">✕</button>
        </div>
        <div id="prompt-modal-body" class="flex-1 overflow-auto text-xs text-slate-300 markdown-body bg-[#0f172a] rounded-lg p-4 border border-slate-800"></div>
      </div>
    </div>

    <!-- Main Layout -->
    <div class="flex flex-1 overflow-hidden">
        <!-- File Browser -->
        <div id="file-panel" class="w-[250px] border-r border-slate-800/50 flex flex-col overflow-hidden">
            <div class="px-3 py-2 border-b border-slate-800/50">
                <span class="text-xs font-bold text-slate-400">FILES</span>
            </div>
            <div id="file-tree" class="flex-1 overflow-y-auto text-xs p-1"></div>
        </div>

        <!-- Chat -->
        <div class="flex-1 flex flex-col min-w-0">
            <div id="chat" class="flex-1 overflow-y-auto overflow-x-hidden p-4 space-y-2"></div>
            <div class="p-3 border-t border-slate-800/50">
                <div class="flex gap-2">
                    <textarea id="chat-input" rows="2" placeholder="Message..."
                        class="flex-1 px-3 py-2 bg-slate-900 border border-slate-800 rounded-lg text-sm resize-none focus:border-indigo-500 focus:outline-none transition-colors"></textarea>
                    <div class="flex flex-col gap-1 self-end">
                        <button id="stop-btn" class="px-4 py-2 bg-red-900 hover:bg-red-800 rounded-lg text-sm font-medium transition-colors hidden">Stop</button>
                        <button id="send-btn" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-lg text-sm font-medium transition-colors">Send</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Panel -->
        <div class="w-[320px] border-l border-slate-800/50 flex flex-col overflow-hidden">
            <!-- Agent Info -->
            <div id="agent-info" class="px-4 py-3 border-b border-slate-800/50 space-y-2">
                <div class="flex items-center justify-between">
                    <span id="ai-name" class="font-semibold text-sm"></span>
                    <div class="flex items-center gap-2">
                        <button id="compact-btn" class="text-slate-500 hover:text-amber-300 text-xs hidden" title="Compact context">🗜</button>
                        <button id="view-prompt-btn" class="text-slate-500 hover:text-indigo-300 text-xs hidden" title="View system prompt">📜</button>
                        <span id="ai-status" class="text-xs font-mono"></span>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-x-4 gap-y-1 text-xs">
                    <span class="text-slate-500">Model</span><span id="ai-model" class="text-slate-300 break-all"></span>
                    <span class="text-slate-500">Cost</span><span id="ai-cost" class="text-green-400"></span>
                    <span class="text-slate-500">Branch</span><span id="ai-branch" class="text-indigo-400 break-all font-mono"></span>
                    <span class="text-slate-500">Scope</span><span id="ai-scope" class="text-slate-400 text-xs break-all"></span>
                </div>
            </div>

            <!-- Agent List -->
            <div class="flex-1 overflow-y-auto">
                <div id="agent-list" class="p-2 space-y-1"></div>
            </div>
        </div>
    </div>

    <!-- File Preview Modal -->
    <div id="file-preview-modal" class="fixed inset-0 bg-black/60 backdrop-filter backdrop-blur-sm z-50 items-center justify-center hidden">
        <div class="glass glow rounded-xl flex flex-col w-[700px] max-w-[90vw] max-h-[80vh]">
            <div class="flex items-center justify-between px-4 py-3 border-b border-slate-800/50 shrink-0">
                <span id="file-preview-path" class="text-xs font-mono text-slate-400 truncate max-w-[80%]"></span>
                <button id="file-preview-close" class="text-slate-500 hover:text-white text-lg">✕</button>
            </div>
            <pre id="file-preview-content" class="flex-1 overflow-auto text-xs p-4 whitespace-pre-wrap break-all text-slate-300" style="overflow-x:hidden;word-wrap:break-word"></pre>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
